id: multi-agent
one_liner: |
  N 体のキャラクターが同じセッションに参加し、発話権を制御しながら自律会話する
  マルチエージェント基盤。pneuma-core 既存の 1 character ↔ 1 engine 前提を超えて、
  3 体以上の AI が共存する世界を扱う。AITuber 配信のコア基盤。
  （Phase 0 C で `src/pneuma_core/multi_agent/` として新規実装される。
   source_ref は実装後に Issue ごとに埋める）
invariants:
  - id: turn-rotation-base
    text: "発話権は順次キャラクターを巡る（A→B→C→A→...）ベース。具体的な決定アルゴリズムは FloorController が拡張する。"
  - id: thinking-on-every-turn
    text: "各ターンで全キャラクターの thinking は走り、内部状態（PAD・想起記憶）が更新される。発話するかは別判定。"
  - id: observation-turn-state-update
    text: "自分のターンでなくても、他キャラの発話・行動は自分の history に積まれ、PAD 評価対象になる（聞いているキャラの内面も動く）。"
  - id: utterance-action-pair
    text: "1 ターンの出力は (speech, action) のペア。speech 空 = 沈黙、action 空 = 動かない。両方空も許容（完全沈黙ターン）。"
  - id: floor-controller-decision
    text: "FloorController は性格（外向性）・直前発話への関連度・直近の発話頻度（喋りすぎ抑制）をスコアリングして次ターンの発話者を決める。"
  - id: multi-agent-session-end
    text: "MultiAgentSession 終了時、N 体ぶんの episodic/semantic/relation を一括統合更新する（既存 SessionEndPipeline の N 体対応）。"
  - id: turn-rate-limit
    text: "1 セッション当たりの LLM 呼び出し回数・TTS リクエスト数に上限がある（コスト暴走防止のサーキットブレーカー）。"
    rationale: |
      ターン頻度暴走（無限ループ・リトライ嵐）で API 課金が想定外に膨らむのを防ぐ。
      上限は ADR-0001 のコスト hard limit と整合させる。
  - id: intent-driven-utterance
    text: |
      各キャラは長期欲求（values/goals/desires）と状況（shared_context）から短期
      ゴール（思惑 = Intent: surface_goal/hidden_goal/intensity）を持ち、発話は
      その思惑に駆動される。思惑は発話プロンプトに注入され、FloorController も
      intent_relevance（直前発話が自分の思惑に絡むか）を intensity でスケールして
      スコアに加味する。
    source_ref: src/pneuma_core/multi_agent/intent.py:IntentGenerator
    test: tests/multi_agent/test_intent.py
  - id: intent-emergent-not-scripted
    text: |
      短期ゴール（思惑）は長期欲求 + 状況から創発的に生成され、展開（いつ何が
      起きるか）は台本化しない。Intent 生成は Tool Use 強制の structured_completion
      で行い、温度を高めにして決定論的にならないようにする（同じキャラ・同じ状況
      でも思惑の表出が毎回同じにはならない）。
    source_ref: src/pneuma_core/multi_agent/intent.py:Intent
    test: tests/multi_agent/test_intent.py
  - id: speech-thought-separation
    text: |
      各ターンは表の発言（speech）と裏の本音（thought）を分離生成・分離記録し、
      両者にギャップがありうる（例: 表では強気だが内心は引けないだけ）。thought は
      Utterance.thought / CharacterRuntimeState.last_thought / snapshot に保持され、
      視聴者は thought を観測できる（会話相手には見えない）。
    source_ref: src/pneuma_core/multi_agent/session.py:MultiAgentSession
    test: tests/multi_agent/test_intent.py
  - id: fun-engine-toggleable
    text: |
      面白さの各創発要素（思惑/クセ/テンポ/水平思考/感情ダイナミクス/構造的オチ）は
      FunEngineConfig で独立に ON/OFF でき、OFF 時は既存挙動を変えない。デフォルトは
      enable_intent のみ True で #20 の挙動を保つ。各要素は出力（セリフ/展開/結末）を
      決める台本ではなく、傾向・性質（入力）をプロンプト/挙動に与える創発として実装する。
    source_ref: src/pneuma_core/multi_agent/fun_config.py:FunEngineConfig
    test: tests/multi_agent/test_fun_config.py
  - id: quirk-emergent
    text: |
      キャラのクセ（思考の歪み）は character.yaml の quirk（思考傾向）として与えられ、
      enable_quirk ON 時に発話プロンプトへ注入される。「お題を自分のクセに引き寄せる」
      「優等生的な深掘り回答を避ける」を促すが、セリフは台本化せず適用は LLM の自律。
    source_ref: src/pneuma_core/multi_agent/session.py:_build_fun_sections
    test: tests/multi_agent/test_fun_config.py
  - id: lateral-thinking-promoted
    text: |
      水平思考的飛躍（連想・アナロジー）は enable_lateral_thinking ON 時にプロンプトで
      促されるが、どんなアナロジーにするか（中身）は LLM が自律生成する。台本化しない。
    source_ref: src/pneuma_core/multi_agent/session.py:_build_fun_sections
    test: tests/multi_agent/test_fun_config.py
  - id: emotion-temperature-diversity
    text: |
      enable_emotion_dynamics ON 時、推定 PAD を各キャラの性格 baseline 側へブレンドして
      引き戻し、全キャラが同方向に高止まり（収束）するのを解消して温度差を作る。baseline は
      性格ごとに異なるため、会話が進んでも自分の性格起点の温度が残る。
    source_ref: src/pneuma_core/multi_agent/session.py:_apply_emotion_dynamics
    test: tests/multi_agent/test_fun_config.py
  - id: structured-ending-external
    text: |
      構造的オチは enable_structured_ending ON 時、「締切/決定の強制」という外圧（入力）
      として与えられる。CircuitBreaker の残りターン比率で「終盤」を判定し、終盤にのみ
      「そろそろ結論・決着に向かう」をプロンプト注入して収束を促す。結末そのもの（何に
      決まるか）は台本化せず LLM の自律に委ねる。
    source_ref: src/pneuma_core/multi_agent/session.py:_is_endgame
    test: tests/multi_agent/test_fun_config.py
  - id: pad-text-consistency
    text: |
      観測される確定 emotion_label（state.emotion）と、そのターンの thought（裏の本音）の
      感情方向が正反対にならない。1 ターンの順序は「前ターンの emotion を注入して speech/
      thought を生成 → そのターンの感情を再推定して state.emotion を確定 → 確定した
      state.emotion と生成済み thought を照合し、正反対なら label を thought 側に補正」。
      補正後の emotion_label は state.emotion・Utterance・emotion_changes・pad_history・
      snapshot のすべてに書き戻し、観測される全計器（CLI 主表示 / Web バッジ / snapshot の
      characters[].emotion / history_tail[].emotion_label）が一致する。構造的オチ（終盤
      収束）は emotion を強制上書きしない（speech/thought の収束だけ促す）。
      内心が見える作品では計器（emotion_label）とテキストの矛盾が観測の信頼を壊すため。
    source_ref: src/pneuma_core/multi_agent/emotion_text_consistency.py:resolve_emotion_text_consistency
    test: tests/multi_agent/test_emotion_text_consistency.py
  - id: speaker-episodic-guaranteed
    text: |
      MultiAgentSession のセッション終了時、発話したキャラ（speak_count>0）は episodic を
      最低 1 件持つことを保証する。LLM 分析が空 episodic を返した場合（全要素 ON 時の生成
      負荷でスキップされる等）でも、直近の会話からフォールバック episodic を 1 件補完する。
      発話していないキャラには強制しない（過剰生成を避ける）。観測対象として参加した
      キャラの記憶が空になる取りこぼしを防ぐ。
    source_ref: src/pneuma_core/multi_agent/session_end.py:MultiAgentSessionEndPipeline
    test: tests/multi_agent/test_episodic_guarantee.py
  - id: cast-naming-fixed
    text: |
      このセッションに実在するキャストの本名と呼称（他キャラからの呼び方）だけを発話
      プロンプト先頭の固定表で明示し、それ以外の名前（他作品・旧デモのキャラ名「リン」
      「アイネ」等）を会話・mock 応答に出さない。キャスト呼称表を build_cast_roster_section
      で生成して system_prompt に注入し、生成時の逸脱を防ぐ。
    source_ref: src/pneuma_core/multi_agent/session.py:build_cast_roster_section
    test: tests/multi_agent/test_cast_naming.py
  - id: canon-continuity
    text: |
      storage を指定して MultiAgentSession を動かすと、正史（1 本の連続した世界線）が
      キャラ ID 単位で積み上がる。セッション終了時に persist_canon で各キャラの新規
      episodic 記憶・最終 emotion・関係性(relations) を storage に永続化し、次セッション
      開始時に load_canon が前回状態を読み戻して CharacterRuntimeState を初期化する
      （前回の emotion・relations を引き継ぎ、記憶を持った状態で始まる）。永続化の単位は
      session_id ではなくキャラ ID。これにより「セッション A の出来事がセッション B の
      キャラに引き継がれる」連続性が成立する。storage 未指定なら no-op（in-memory のみ・
      既存挙動不変）で、正史は積まない。
    source_ref: src/pneuma_core/multi_agent/session.py:persist_canon
    test: tests/multi_agent/test_canon_continuity.py
  - id: memory-rag-recall
    text: |
      storage 指定時、発話プロンプトに注入する想起記憶は episodic の単純スライス
      （state.episodic[-3:]）ではなく、MemorySearchEngine の性格バイアス検索の結果を使う。
      いま話している話題（直前発話 + shared_context）の embedding で過去記憶をスコアリング
      し、トピック関連性が一定以上の記憶のみを想起する（importance だけで浮上する無関連
      記憶は想起しない）。これにより差別化軸2「記憶バイアス RAG」が会話ループに配線される。
      storage / embedding が無い、または母集団が空ならフォールバックとして従来どおり直近
      episodic スライスを返す（既存挙動を保つ）。
    source_ref: src/pneuma_core/multi_agent/session.py:_rag_recall
    test: tests/multi_agent/test_canon_continuity.py
source_files:
  - src/pneuma_core/
depends_on:
  - models
  - protocols
  - emotion
  - llm
  - memory
  - runtime
