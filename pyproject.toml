[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pneuma-core"
version = "0.1.0"
description = "AI character engine core - personality, emotion, memory, and goals"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Kyohei" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["anthropic>=0.40", "openai>=1.50"]

[project.urls]
Homepage = "https://github.com/mizkun/pneuma"
Repository = "https://github.com/mizkun/pneuma"
"Bug Tracker" = "https://github.com/mizkun/pneuma/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_core"]
