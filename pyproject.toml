[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pneuma-core"
version = "0.1.0"
description = "AI character engine core - personality, emotion, memory, and goals"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["anthropic>=0.40", "openai>=1.50"]

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_core"]
