name: pneuma-core
kind: product

vision: |
  pneuma-core は、AIキャラクターに固有の内面（性格・感情・記憶・関係性）を与え、
  会話を重ねるほどその内面が変化していく Python ライブラリである。

  現在の AIチャットボットは「ステートレスな道具」に過ぎない。会話履歴は保持されるが、
  キャラクターとしての内面 — 性格、価値観、感情、記憶、目標 — が有機的に連動して
  変化することはない。pneuma-core はこの "内面のレイヤー" を再利用可能な形で提供する。

  LLMプロバイダーやストレージに依存しない Protocol ベースの設計で、
  Claude / OpenAI / ローカルLLM、SQLite / PostgreSQL / インメモリなど、
  自由に組み合わせて使える。

problem: |
  AIキャラクターを構築する開発者は、感情モデル・記憶システム・性格の影響ロジックを
  すべて自前で実装する必要がある。しかも性格心理学の知見を正しく反映するのは難しい。
  これはアプリ層の本質ではないにも関わらず、毎回ゼロから書かれている。

target_users:
  primary:
    role: AIキャラクター開発者
    needs:
      - "`pip install pneuma-core` で性格・感情・記憶を持つキャラクターを動かしたい"
      - プロンプトエンジニアリングではなくキャラクター定義（YAML）だけで「生きたキャラクター」を実現したい
      - LLMプロバイダーやストレージを自由に差し替えたい
  secondary:
    role: AI研究者・実験者
    needs:
      - 性格心理学ベースの AI 行動モデルを研究・実験したい
      - Big Five / PAD / Schwartz Values を組み合わせた内面モデルに興味がある

value_proposition:
  - title: 設定を書くだけでキャラクターが動く
    detail: |
      YAMLでキャラクターを定義し、LLMアダプタとストレージを渡すだけで、
      性格に基づく感情変化、記憶の蓄積と想起、関係性の発展が自動で動く。
  - title: 理論に基づく豊かな内面モデル
    detail: |
      Big Five 性格特性、PAD 3次元感情空間、性格バイアス付き記憶検索、
      エピソード記憶 + セマンティック記憶の二重記憶システム。
  - title: Protocol ベースの拡張性
    detail: |
      LLM・ストレージ・記憶検索・Embedding・音声・タスク管理がすべて Protocol で抽象化されており、
      差し替え・拡張可能。ミドルウェアで機能を自由に追加できる。
  - title: 二段構えアーキテクチャ
    detail: |
      ターンごとの処理 (リアルタイム): 感情減衰 → 記憶検索 → プロンプト構築 → 応答生成 → 感情再推定。
      セッションごとの処理 (会話終了時): エピソード記憶保存 → セマンティック記憶更新 → 関係性更新。

core_principles:
  - id: char_eye_view
    name: キャラクターから見たら全部同じ
    detail: |
      キャラクターのランタイムは、相手が人間であろうと他のキャラクターであろうとシステムであろうと、
      同一のインターフェースでメッセージを受け取り、同一のパイプラインで応答する。
  - id: protocol_based
    name: Protocol ベース・LLMプロバイダー非依存
    detail: |
      全ての外部依存は Protocol（インターフェース）で抽象化。
      anthropic / openai は optional extras（`pip install pneuma-core[anthropic]`）。
      コア自体は特定のLLMプロバイダーに依存しない。
  - id: numeric_inside_natural_outside
    name: 内部表現は数値、プロンプト表現は自然言語
    detail: |
      Big Five, PAD, closeness/trust 等の数値は計算のために必要だが、
      LLMに渡すときは自然言語に変換する（`pleasure: 0.72` ではなく「とても楽しい気分」）。

architecture_overview: |
  pneuma_core/
    models/        # データモデル（Character, Entity, Emotion, Memory, etc.）
    protocols/     # 全Protocol定義（LLM, Storage, Memory, Embedding, etc.）
    emotion/       # 感情エンジン（PAD, baseline, decay, mapping）
    memory/        # 記憶システム（Store, Search, Consolidator）
    runtime/       # ランタイム（Engine, ContextAssembler, Session）
    storage/       # ストレージ実装（SQLite, InMemory）
    llm/           # LLMアダプタ実装（Claude, OpenAI）
    voice/         # 音声 Protocol（STT, TTS）
    task/          # タスク管理 Protocol

five_contexts:
  - id: personality
    name: Personality (性格 — Big Five)
    mutability: 不変
    detail: キャラクター作成時に決定。記憶検索の重み係数に影響する。
  - id: values
    name: Values (価値観 — Schwartz 4 カテゴリ)
    mutability: 不変
    detail: キャラクター作成時に決定。
  - id: memory
    name: Memory (記憶 — 二重記憶システム)
    detail: |
      エピソード記憶（具体的な出来事）+ セマンティック記憶（汎化された知識）。
      性格バイアス付きハイブリッドスコアリングで検索。
  - id: goals
    name: Goals (目標 — 3 階層)
    detail: Vision → Objective → Task の階層構造。
  - id: state
    name: State (感情状態 — PAD 3次元空間)
    detail: PAD 空間で表現。Big Fiveからベースライン算出。指数減衰でベースラインに回帰。

success_definition:
  short_term:
    - PyPI で `pip install pneuma-core` できる
    - README のサンプルコードをコピペするだけでキャラクターと会話できる
    - 全テストがパスし、CI が回っている
  mid_term:
    - GitHub Stars 100+
    - 外部の開発者が pneuma-core を使ったアプリケーションを作っている
    - ドキュメントサイトが整備されている
  long_term:
    - AIキャラクターフレームワークのデファクトスタンダードの一つになっている
    - コミュニティからの PR が来ている

constraints:
  technical:
    - コア自体は anthropic / openai パッケージに直接依存しない（optional extras）
    - SQLite は単一プロセス書き込み制約（StorageBackend 差し替えで対応可）
  design:
    - I/O アダプタ（Discord, CLI 等）はコアに含めない
    - アプリ固有のロジック（Vault, Diary, 特定タスクバックエンド）はコアに含めない
    - Protocol で抽象化し、実装はアプリ側の責任

tech_stack:
  - { item: 言語, choice: "Python 3.12+", reason: "AI エコシステムとの親和性" }
  - { item: ビルド, choice: hatchling, reason: "標準的な Python パッケージング" }
  - { item: DB,    choice: "SQLite (同梱)", reason: "外部依存なしで動作" }
  - { item: テスト, choice: "pytest + pytest-asyncio", reason: "TDD 必須" }
  - { item: リンター, choice: ruff, reason: "高速" }

milestones:
  phase_1:
    name: 切り出し + 安定化
    status: done
    items:
      - モノリポからの pneuma-core 分離
      - Protocol 整理 + anthropic 直接依存の排除
      - PyPI 公開準備（pyproject.toml, README, ライセンス）
      - 全テストの移行と通過確認
  phase_2:
    name: OSS 公開品質
    status: in_progress
    items:
      - ドキュメント整備（Getting Started, API Reference）
      - サンプルコード充実（examples/）
      - CI/CD セットアップ（GitHub Actions: テスト + リント + PyPI 公開）
      - CHANGELOG.md の整備
      - Contributing ガイドの作成
  phase_3:
    name: 機能拡張
    status: planned
    items:
      - Post-turn Analysis の改善（感情推定精度向上）
      - セマンティック記憶の統合アルゴリズム改善
      - ストリーミング応答対応
      - ローカル LLM アダプタ（Ollama）
  phase_4:
    name: エコシステム
    status: planned
    items:
      - ドキュメントサイト（mkdocs 等）
      - プラグインシステムの正式化
      - ベクトル DB 対応（FAISS, Qdrant）
      - コミュニティ向けキャラクターテンプレート

next_actions:
  high:
    - GitHub Actions CI セットアップ
    - README の Getting Started セクション充実
    - examples/ にミニマルなサンプル追加
  medium:
    - API ドキュメント自動生成
    - テストカバレッジ計測 + バッジ
  low:
    - ベンチマークスイート

