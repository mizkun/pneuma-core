id: pneuma-core
version: 1

# ─── Tier 1–3 Principles (the constitution) ───────────────────────────────
principles:
  tier1_non_negotiable:
    - id: char-eye-view
      text: |
        キャラクターから見たら全部同じ。process_message() という単一インターフェースで
        人間 / キャラクター / システムを区別せずに受け、同一パイプラインで応答する。
      rationale: |
        相手の種別ごとに分岐すると、内面 (記憶・感情・関係性) のルールが
        場面ごとに歪み、キャラクターの一貫性が壊れる。境界は外側のアダプタが吸収する。
    - id: protocol-based-llm-neutral
      text: |
        LLM プロバイダおよびストレージは Protocol で抽象化し、コアは特定プロバイダに
        直接依存しない。anthropic / openai は optional extras (`pneuma-core[anthropic]`)。
      rationale: |
        プロバイダ変動が激しい領域。コアが anthropic / openai に直結すると、
        利用者の選択肢が縛られ、テストも遅くなる。
    - id: numbers-inside-words-outside
      text: |
        内部表現は数値、プロンプト表現は自然言語。Big Five / PAD / closeness は
        数値で計算し、LLM へ渡す前に必ず自然言語に変換する。
      rationale: |
        LLM に数値を直接渡すとモデル間で意味のばらつきが大きい。自然言語化することで
        「何を何のために伝えるか」を境界として明示できる。

  tier2_strong_preference:
    - id: tdd-first
      text: テストを先に書き (Red)、実装で通し (Green)、必要に応じてリファクタする。
      rationale: 内面モデルは規則の積み重ねで成立する。後追いテストは抜け漏れが出やすい。
    - id: middleware-extensibility
      text: 機能追加は Middleware (pre_process / post_process) で行う。コアパイプラインは触らない。
      rationale: パイプラインに直接機能を足すと、利用側のコアがバージョン依存になる。
    - id: graceful-degradation
      text: LLM / ストレージ障害時は内部状態の整合性を保ったまま縮退させる。
      rationale: 1 ターンの失敗で全状態を壊すと、長期記憶を扱う前提と矛盾する。

  tier3_aspirational:
    - id: oss-defacto
      text: AI キャラクターフレームワークのデファクトスタンダードの一つになる。
      rationale: ライブラリの価値は採用と外部からの寄与で示される。
    - id: psychology-grounded
      text: 性格心理学 (Big Five / Schwartz / PAD) の知見を素直に反映する。
      rationale: ad-hoc な感情モデルではなく、議論できる根拠を持たせるため。

# ─── Product-wide non-negotiables ─────────────────────────────────────────
non_negotiable:
  - コアは anthropic / openai パッケージに直接依存しない (extras 経由のみ)
  - I/O アダプタ (Discord, CLI 等) はコアに含めない
  - アプリ固有のロジック (Vault, Diary, 特定タスクバックエンド等) はコアに含めない
  - 個人データ (記憶・会話履歴) はローカルストレージに保存し、外部に送らない
  - LLMRequest の messages に system ロールを混入させない (incident #1, fix #2)

customer_profile: |
  Primary: AIキャラクター開発者。`pip install pneuma-core` で性格・感情・記憶を持つ
  キャラクターを動かしたい。プロンプトエンジニアリングではなく、キャラクター定義
  (YAML) だけで「生きたキャラクター」を実現したい。
  Secondary: AI 研究者・実験者。Big Five / PAD / Schwartz Values を組み合わせた
  内面モデルに興味がある。

# ─── Glossary ─────────────────────────────────────────────────────────────
glossary:
  PAD: Pleasure / Arousal / Dominance の 3 次元感情空間。値域は [-1, 1]。
  BigFive: Openness / Conscientiousness / Extraversion / Agreeableness / Neuroticism。値域は [0, 1]。
  Schwartz: Self-Transcendence / Self-Enhancement / Openness-to-Change / Conservation の 4 上位カテゴリ。
  Episodic: 具体的な出来事の記憶 (timestamp, importance, embedding を持つ)。
  Semantic: エピソードから汎化された知識・関係性の理解 (confidence, source_episode_ids)。
  Personality: Big Five に基づく不変的性格特性。記憶検索の重み係数に影響する。
  Mood: PAD の指数移動平均で表される時間〜日スケールの中期感情。
  Pipeline: ターン処理 (decay → 検索 → プロンプト → LLM → 再推定) と セッション終了処理 (記憶整理) の 2 粒度。
  Middleware: pre_process / post_process でパイプラインに介入するフック。
  Protocol: typing.Protocol による抽象境界 (LLMAdapter / StorageBackend / MemoryStore / EmbeddingService 等)。
  Adapter: Protocol の具体実装 (ClaudeAdapter, SQLiteStorageBackend など)。
  PromptCache: 静的 system プロンプトをキャッシュ単位で送る最適化。

# ─── Open questions ───────────────────────────────────────────────────────
open_questions:
  - id: streaming-response
    text: ストリーミング応答 (LLMAdapter.generate のジェネレータ化) をどの段階で導入するか。
  - id: vector-store
    text: 大規模利用時のベクトル DB 対応 (FAISS / Qdrant / pgvector) のどれを最初に同梱するか。
  - id: local-llm-adapter
    text: ローカル LLM (Ollama 等) 用アダプタの API 形状をどこまで anthropic 風に揃えるか。
  - id: semantic-merge
    text: セマンティック記憶の統合アルゴリズム (重複判定・要約) を LLM に任せるかルールベースに留めるか。

# ─── Technical constraints ────────────────────────────────────────────────
technical_constraints:
  - Python 3.12+ をターゲットにする (typing 構文、PEP 695 を許容)
  - ビルドは hatchling、テストは pytest + pytest-asyncio、リンタは ruff
  - 同梱 DB は SQLite (外部依存なしで動作)。単一プロセス書き込み制約あり
  - 同期的に LLM を呼ぶ箇所はランタイムから隔離 (応答生成は非同期)
  - プロンプトキャッシュ対応のため、静的セクションと動的セクションを分離可能にする

# ─── Domain identifiers (slugs) ──────────────────────────────────────────
domains:
