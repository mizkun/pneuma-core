id: storage
version: 1

who: AI agent developing pneuma-core
why: |
  キャラクターの内部状態 (Character / Memory / EmotionalState / Goals /
  Relation / ChangeRecord / TodoItem) を永続化する層。
  StorageBackend Protocol で抽象化されており、実装は差し替え可能。
  SQLite / InMemory が同梱、それ以外は外部実装に委ねる。

invariants:
  - id: backend-substitutability
    text: StorageBackend を差し替えても、ランタイム挙動は同じであるべき (Protocol 規約)
  - id: local-storage-only
    text: 個人データはローカルストレージに保存され、外部に送られない
  - id: sqlite-single-writer
    text: 同梱 SQLite は単一プロセス書き込み制約あり。複数プロセス書き込みは別バックエンド (例 PostgreSQL) を選ぶ
  - id: similarity-search-via-backend
    text: ベクトル類似検索は StorageBackend.find_similar_memories を通す (memory.search が直接 SQL を組まない)
  - id: relation-and-todo-mutable
    text: Relation / TodoItem は mutable dataclass。書き込み時は updated_at / completed_at の更新を保証する

modules:
  - id: backend
    story: |
      StorageBackend Protocol の後方互換 re-export。正本は
      `pneuma_core.protocols.storage`。
    responsibility: |
      旧 import path `pneuma_core.storage.backend.StorageBackend` を壊さない。
      Protocol を素通しで再エクスポートする。
    files:
      - src/pneuma_core/storage/backend.py

  - id: sqlite
    story: |
      SQLiteStorageBackend — aiosqlite を使った非同期 SQLite 永続化実装。
      ベクトル類似は Python 側 cosine_similarity で計算する。
    responsibility: |
      Character / Memory (Episodic / Semantic) / Goals (GoalTree) /
      EmotionalState / ChangeRecord / TodoItem / Relation の CRUD を提供する。
      単一プロセス書き込み制約は呼び出し側が認識する前提とする。
    files:
      - src/pneuma_core/storage/sqlite.py

  - id: in_memory
    story: |
      InMemoryStorageBackend — プロセス内 dict による永続化実装。
      テスト・開発で StorageBackend Protocol の挙動確認に使う。
    responsibility: |
      sqlite と同じ Protocol 契約を満たし、プロセス終了で消えること以外は
      同一の振る舞いをする。本番用途では使わない。
    files:
      - src/pneuma_core/storage/in_memory.py

owners:
  - mizkun
