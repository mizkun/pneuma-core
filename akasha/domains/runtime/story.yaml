type: domain
id: domain-runtime
level: L1
who: AI agent
why: |
  キャラクターが 1 メッセージを受け取り応答を返すまでの全パイプラインを
  オーケストレーションする。`process_message()` という単一インターフェースで
  人間 / キャラクター / システムを区別せずに受け、ターン (リアルタイム) と
  セッション終了 (バッチ) の 2 粒度の処理を駆動する。
modules:
  - engine
  - prompt_builder
  - emotion_engine
  - context_assembler
  - middleware
  - response_parser
  - prompt_cache
  - history_summarizer
  - session
  - session_end_pipeline
  - user_context
  - user_context_search
  - user_context_writer
  - user_context_consolidator
  - proactive
  - diary_writer
  - diary_processor
  - diary_coaching
