id: memory
version: 1

who: AI agent developing pneuma-core
why: |
  キャラクターが「思い出す」「学習する」を実現する記憶レイヤー。
  Episodic + Semantic の二重構造で構成し、性格バイアス付き
  ハイブリッドスコアリング (similarity / importance / recency / 時間減衰) で検索する。

invariants:
  - id: personality-biased-recall
    text: 性格 (Big Five) が違えば、同じ問いから想起される記憶が変わる (神経症傾向で重要度重み、開放性で新しさ重みが変動)
  - id: monotonic-score
    text: スコア関数は単調 — similarity / importance / recency が大きくなれば score は減らない
  - id: filtered-accumulation
    text: Episodic の保存は importance_threshold (0.6) と max_episodes_per_conversation (3) と duplicate_similarity_threshold (0.95) でフィルタする
  - id: idempotent-consolidation
    text: Episodic を統合して Semantic を更新する経路は idempotent に近い設計を保つ (同じ入力で同じ結果)
  - id: embedding-required-for-search
    text: 性格バイアス付き類似検索を行う前に embedding が生成されている必要がある (未生成時は降格 or 例外)

modules:
  - id: store
    story: |
      MemoryStore Protocol の後方互換 re-export。正本は
      `pneuma_core.protocols.memory_store.MemoryStore`。
    responsibility: |
      旧 import path `pneuma_core.memory.store.MemoryStore` を壊さない。
      ロジックを持たず、Protocol を素通しで再エクスポートする。
    files:
      - src/pneuma_core/memory/store.py

  - id: search
    story: |
      SearchConfig と MemorySearchEngine による性格バイアス付き
      ハイブリッドスコアリング検索 (similarity / importance / recency / 時間減衰)。
    responsibility: |
      神経症傾向で重要度重み、開放性で多様性重みが変動する性格バイアスを保つ。
      スコアは similarity / importance / recency に単調。top_k で上位を返す。
    files:
      - src/pneuma_core/memory/search.py
    contracts:
      - episodic-memory
      - semantic-memory

  - id: similarity
    story: |
      Embedding ベクトル間のコサイン類似度ユーティリティ cosine_similarity()。
    responsibility: |
      ベクトル次元不一致は ValueError。ゼロベクトルは 0.0 を返す。
      戻り値は [-1.0, 1.0]。
    files:
      - src/pneuma_core/memory/similarity.py
    contracts:
      - embedding-vector

  - id: consolidator
    story: |
      会話履歴から LLM で重要エピソードを抽出し、フィルタを通して
      EpisodicMemory として保存する MemoryConsolidator。
    responsibility: |
      LLM 出力 JSON を {content, importance ∈ [0,1], emotional_valence ∈ [-1,1]}
      に正規化する。importance_threshold / max_episodes_per_conversation /
      duplicate_similarity_threshold によるフィルタリングを保つ。
    files:
      - src/pneuma_core/memory/consolidator.py
    contracts:
      - episodic-memory
      - llm-request
      - llm-response

  - id: semantic_consolidator
    story: |
      関連する EpisodicMemory をクラスタリングし、LLM で汎化された
      SemanticMemory (信頼度・出典エピソード ID 集合付き) を抽出する。
    responsibility: |
      Episodic 群を入力に semantic を生成・更新する経路を idempotent に保つ。
      source_episode_ids を維持し、confidence を [0, 1] に閉じ込める。
    files:
      - src/pneuma_core/memory/semantic_consolidator.py
    contracts:
      - episodic-memory
      - semantic-memory
      - llm-request
      - llm-response

owners:
  - mizkun
