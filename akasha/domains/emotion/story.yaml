id: emotion
version: 1

who: AI agent developing pneuma-core
why: |
  キャラクターの感情状態を Big Five 性格特性と連動させて推論・更新する。
  PAD 3 次元空間で表現し、Big Five からベースラインを算出、
  指数減衰でベースラインへ回帰する。Emotion (秒〜分) と Mood (時間〜日) の
  2 つの時間粒度を扱う。

invariants:
  - id: deterministic-baseline
    text: Big Five が同一なら同一の PAD ベースラインが得られる (pad_mapping は純関数)
  - id: monotonic-convergence
    text: 入力イベントがない時、PAD は Baseline へ単調収束する
  - id: half-life-positive
    text: emotion_half_life は正の秒数 (既定 3600)。0 や負値は不可
  - id: pad-stays-in-range
    text: 減衰後の PAD は常に [-1, 1] に収まる (clamp 必須)
  - id: no-side-effects
    text: emotion/* は永続化を行わない (storage への保存は runtime が責任を持つ)

modules:
  - id: baseline
    story: |
      Big Five 性格特性から PAD ベースライン (pleasure / arousal / dominance) を
      算出する純関数 personality_to_pad_baseline()。
    responsibility: |
      回帰式の係数を保つ:
      P = 0.21E + 0.59A + 0.19(1-N) /
      A = 0.15O + 0.30(1-A) + 0.57N /
      D = 0.25O + 0.17C + 0.60E - 0.32A。
      戻り値は [-1, 1] に clamp する。
    files:
      - src/pneuma_core/emotion/baseline.py

  - id: decay
    story: |
      経過秒数と半減期から現在の感情値をベースラインへ向けて減衰させる
      exponential_decay()。
    responsibility: |
      result = baseline + (current - baseline) * exp(-ln(2)/half_life * elapsed_s)
      の数式を保つ。half_life <= 0 は ValueError、elapsed <= 0 は no-op。
    files:
      - src/pneuma_core/emotion/decay.py

  - id: pad_mapping
    story: |
      PAD 3 値から 8 オクタント + 中立の離散感情ラベル (日本語) を返す
      pad_to_emotion_label()。
    responsibility: |
      threshold (既定 0.3) 未満の軸は「中間」扱いとし、全軸中間なら「中立」。
      8 オクタントのラベル ("喜び（高揚）" "感動" "余裕" "安らぎ" "怒り"
      "恐怖" "倦怠" "絶望") を変えない。
    files:
      - src/pneuma_core/emotion/pad_mapping.py

owners:
  - mizkun
