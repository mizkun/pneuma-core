id: models
version: 1

who: AI agent developing pneuma-core
why: |
  キャラクターを構成する不変的・可変的データ構造を一カ所に集約する。
  純粋なデータ層として I/O や副作用を持たず、数値表現
  (Big Five, PAD, closeness/trust 等) を保持する。
  自然言語化は他層 (runtime / prompt_builder) の責務とする。

invariants:
  - id: bigfive-range
    text: Big Five の各特性 (openness/conscientiousness/extraversion/agreeableness/neuroticism) は [0, 1] で保持する
  - id: pad-range
    text: PAD (pleasure/arousal/dominance) は [-1, 1] で保持する
  - id: schwartz-range
    text: Schwartz 4 カテゴリ (self_transcendence/self_enhancement/openness_to_change/conservation) は [0, 1] で保持する
  - id: pure-data-layer
    text: models/* は I/O や副作用を持たず、副作用は dataclass の __post_init__ における範囲検証のみ
  - id: id-references-not-nesting
    text: GoalTree は visions/objectives/tasks をフラットなリストで保持し、階層は ID 参照で繋ぐ
  - id: importance-confidence-range
    text: EpisodicMemory.importance, SemanticMemory.confidence は [0, 1]、emotional_valence は [-1, 1]
  - id: closeness-trust-range
    text: Relation.closeness, Relation.trust は [0, 1] で保持する
  - id: sender-type-enum
    text: MessageInput.sender_type は {human, character, system} のいずれかに限る

modules:
  - id: character
    story: |
      キャラクターの identity (id / name / personality / values / プロフィール・
      口調などの自由記述) を保持する不変 dataclass。
    responsibility: |
      Character の不変性と、Big Five (Personality) と Schwartz 4 軸 (Values) の
      参照保持を保証する。range 検証は personality / values 側に委譲する。
    files:
      - src/pneuma_core/models/character.py
    contracts:
      - character

  - id: personality
    story: |
      Big Five 性格特性 (openness / conscientiousness / extraversion /
      agreeableness / neuroticism) を [0, 1] で保持する不変 dataclass。
    responsibility: |
      各 trait を [0, 1] に閉じ込め、is_high (≥0.7) / is_low (<0.3) の判定で
      自然言語化や検索バイアスの呼び出し側に閾値を提供する。
    files:
      - src/pneuma_core/models/personality.py

  - id: values
    story: |
      Schwartz の 4 上位カテゴリ (self_transcendence / self_enhancement /
      openness_to_change / conservation) を [0, 1] で保持する不変 dataclass。
    responsibility: |
      各次元を [0, 1] に閉じ込め、is_important (≥0.6) で「重視されている」
      判定を提供する。対立軸の解釈は呼び出し側に委ねる。
    files:
      - src/pneuma_core/models/values.py

  - id: emotion
    story: |
      PAD 3 次元感情 (pleasure / arousal / dominance) と Mood の dataclass。
      EmotionalState は離散ラベル / 状況も併せ持ち、Mood は PAD の指数移動平均。
    responsibility: |
      pleasure / arousal / dominance を [-1, 1] に閉じ込める。
      Mood.update() は (1 - α) * mood + α * emotion の式を保つ。
    files:
      - src/pneuma_core/models/emotion.py
    contracts:
      - emotional-state

  - id: memory
    story: |
      Episodic (具体的な出来事) と Semantic (汎化された知識) の二重記憶の
      dataclass。embedding は 1536 次元程度のベクトルを optional で保持する。
    responsibility: |
      EpisodicMemory.importance / SemanticMemory.confidence を [0, 1]、
      emotional_valence を [-1, 1] に閉じ込める。
    files:
      - src/pneuma_core/models/memory.py
    contracts:
      - episodic-memory
      - semantic-memory

  - id: goals
    story: |
      Vision (5–10 年) → Objective (四半期〜年) → Task (日〜週) の 3 階層
      目標構造を、フラットなリスト + ID 参照で保持する。
    responsibility: |
      GoalTree は階層をネストせず ID 参照で繋ぐ。
      Objective.status / Task.status の enum と Objective.progress ∈ [0, 1] を守る。
    files:
      - src/pneuma_core/models/goals.py
    contracts:
      - goal-tree

  - id: message
    story: |
      Runtime の入出力境界 (MessageInput / MessageOutput) と
      補助型 (SystemMessage / StructuredResponse / ToolCall) の dataclass。
    responsibility: |
      MessageInput.sender_type を {human, character, system} に限定する。
      MessageOutput の構造化フィールド (thought / action / tool_calls /
      internal_changes / system_messages) の意味を保つ。
    files:
      - src/pneuma_core/models/message.py
    contracts:
      - message-input
      - message-output

  - id: relation
    story: |
      エンティティ間の関係性 (owner_id / target_id / relationship_type /
      closeness / trust) を保持する dataclass。
    responsibility: |
      closeness / trust を [0, 1] で扱う運用前提を維持する
      (現状の dataclass は範囲検証を持たないため、書き込み側が責任を持つ)。
    files:
      - src/pneuma_core/models/relation.py
    contracts:
      - relation

  - id: change_record
    story: |
      内部状態変化 (emotion_updated / memory_added / goal_updated 等) の
      ログ単位を表す不変 dataclass。
    responsibility: |
      type / before / after / reason / timestamp を変更前後のスナップショットとして残す。
      自由文字列の type だが、後段の集計が成立するよう既存の値を勝手に変えない。
    files:
      - src/pneuma_core/models/change_record.py
    contracts:
      - change-record

  - id: todo
    story: |
      TODO と習慣管理を兼ねるアイテム (label: habit/deadline/this_week/someday,
      kind: must/want, status: pending/done/skipped 等) の mutable dataclass。
    responsibility: |
      priority / status / recurrence の意味は現状 dataclass レベルで強制せず、
      呼び出し側の運用に委ねる。owner_id 既定値 "user" を変えない。
    files:
      - src/pneuma_core/models/todo.py

  - id: entity
    story: |
      キャラクターとユーザーを同一インターフェースで扱うための EntityContext と
      build_from_character / build_from_user_context のヘルパ。
    responsibility: |
      Character / UserContext を破壊せず Entity に "包む" 追加レイヤとして振る舞う。
      entity_type を {character, user} に限定する。
    files:
      - src/pneuma_core/models/entity.py

  - id: diagnostic
    story: |
      debug / tuning 用途で 1 ターンの内部状態 (personality, emotion,
      emotion_trigger, memories_retrieved, token_usage, model) を集約する dataclass。
    responsibility: |
      MessageOutput.diagnostic に運ぶ可観測スナップショット。値の意味は
      書き込み側 (runtime) に依存するため、ここではフィールド名と shape のみ固定する。
    files:
      - src/pneuma_core/models/diagnostic.py

owners:
  - mizkun
