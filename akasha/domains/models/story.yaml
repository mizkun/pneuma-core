type: domain
id: domain-models
level: L1
who: AI agent
why: |
  キャラクターを構成する不変的・可変的データ構造を一カ所に集約する。
  純粋なデータ層とし、I/O や副作用を持たない。数値表現 (Big Five, PAD,
  closeness/trust 等) を保持し、自然言語化は他層 (runtime) の責務。
modules:
