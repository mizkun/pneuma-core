id: llm
version: 1

who: LLMAdapter / EmbeddingService を実装または差し替える開発者
why: |
  LLM プロバイダおよび Embedding サービスとの境界を成す層。
  Protocol で抽象化された LLMAdapter / EmbeddingService の実装を提供する。
  anthropic / openai への直接依存を許容するのはこの層のみ。

invariants:
  - id: only-llm-layer-uses-vendors
    text: anthropic / openai パッケージへの直接依存は pneuma_core.llm.* 配下に限る (runtime / memory は型のみ参照)
  - id: extras-optional
    text: anthropic / openai は optional extras (`pip install pneuma-core[anthropic]` / `[openai]`)
  - id: system-prompt-not-in-messages
    text: LLMRequest.messages に system ロールを混入させない。system は system_prompt フィールドへ集約 (incident #1, fix #2)
  - id: temperature-range
    text: temperature は [0.0, 2.0]
  - id: max-tokens-positive
    text: max_tokens > 0
  - id: response-includes-usage
    text: LLMResponse は { content, model, usage } を必ず返す (cost / cache 観測のため)

modules:
  - id: adapter
    story: |
      LLMAdapter Protocol と LLMRequest / LLMResponse / ModelConfig の
      後方互換 re-export。正本は `pneuma_core.protocols.llm`。
    responsibility: |
      旧 import path `pneuma_core.llm.adapter.LLMAdapter` を壊さない。
      Protocol と dataclass を素通しで再エクスポートする。
    files:
      - src/pneuma_core/llm/adapter.py
    contracts:
      - llm-request
      - llm-response

  - id: claude
    story: |
      Anthropic Claude API を呼び出す LLMAdapter 実装。`pneuma-core[anthropic]`
      extras で同梱され、コア層は直接 anthropic に依存しない経路を保つ。
    responsibility: |
      LLMRequest.system_prompt を Anthropic の system 引数に渡し、
      messages に system ロールを混入させない。APITimeoutError は
      LLMTimeoutError に変換する。レスポンス content / model / usage を返す。
    files:
      - src/pneuma_core/llm/claude.py
    contracts:
      - llm-request
      - llm-response

  - id: embedding
    story: |
      EmbeddingService Protocol と OpenAI 実装 (OpenAIEmbeddingService)。
      既定モデルは `text-embedding-3-small`。
    responsibility: |
      embed(text) は list[float]、embed_batch(texts) は list[list[float]] を返す。
      openai への直接依存はこのファイルに閉じる。
    files:
      - src/pneuma_core/llm/embedding.py
    contracts:
      - embedding-vector

owners:
  - mizkun
